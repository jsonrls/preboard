        const sampleQuestions = [

                text: "What is the unit of electrical resistance?",

            },

                options: ["5 ohms", "10 ohms", "20 ohms", "100 ohms"],
                correctAnswer: "5 ohms",
                difficulty: "Medium"
            }
        ];

        // Security Helper
        async function hashPassword(pass) {
            const msgBuffer = new TextEncoder().encode(pass);
            const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        authBtn.addEventListener('click', async () => {
            const password = document.getElementById('setup-password').value;
            if (password.length < 6) { log("Password must be at least 6 characters."); return; }
            authBtn.disabled = true;
            log("Creating system accounts...");
            const accounts = [
                { email: "admin@catci.edu.ph", role: "admin", name: "System Administrator" },
                { email: "teacher@catci.edu.ph", role: "teacher", name: "Lead Faculty", department: "Engineering (EE)" }
            ];
            for (const acc of accounts) {
                try {
                    log(`Registering ${acc.email}...`);
                    const res = await createUserWithEmailAndPassword(auth, acc.email, password);
                    log(`Setting role to '${acc.role}' in Firestore...`);
                    const userData = {
                        name: acc.name,
                        email: acc.email,
                        role: acc.role,
                        passwordHash: await hashPassword(password),
                        createdAt: serverTimestamp()
                    };
                    if (acc.role === "teacher") {
                        userData.teacherId = "T2026-000"; 
                        userData.department = acc.department;
                    }
                    await setDoc(doc(db, "users", res.user.uid), userData);
                    log(`SUCCESS: ${acc.email} created.`);
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        log(`Notice: ${acc.email} already exists in Auth. Please check Firestore roles.`);
                    } else {
                        log(`ERROR [${acc.email}]: ${err.message}`);
                    }
                }
            }
            authBtn.disabled = false;
        });

        runBtn.addEventListener('click', async () => {
            runBtn.disabled = true;
            logEl.textContent = "Starting initialization...";
            try {
                log("Creating 50 students...");
                for (const student of sampleStudents) {
                    await addDoc(collection(db, "students"), { ...student, createdAt: serverTimestamp() });
                    log(`Added: ${student.name}`);
                }
                log("Initializing Question Bank...");
                const importSessionId = "setup-session-" + Date.now();
                const sessionRef = doc(db, "question_banks", importSessionId);
                await setDoc(sessionRef, {
                    subject: "Mathematics",
                    sessionName: "Setup Sample Session",
                    importedAt: serverTimestamp(),
                    uploaderEmail: "system@pbec.edu"
                });

                for (const q of sampleQuestions) {
                    await addDoc(collection(sessionRef, "questions"), { 
                        ...q, 
                        subject: "Mathematics",
                        importSessionId,
                        importedAt: serverTimestamp(),
                        sessionName: "Setup Sample Session"
                    });
                    log(`Added Question: ${q.text.substring(0, 20)}...`);
                }
                log("Initializing Exams collection...");
                await addDoc(collection(db, "exams"), { title: "Practice Exam #1", status: "draft", createdAt: serverTimestamp() });

                log("Data initialization complete.");

            } catch (err) {
                log(`ERROR: ${err.message}`);
                runBtn.disabled = false;
            }
